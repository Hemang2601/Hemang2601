<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 584 294" width="100%" role="img" aria-label="EventEase — Event Check-In - Team NexGen Coders (Team Leader)">
  <defs>
    <linearGradient id="pcbg-eventease-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120" />
      <stop offset="100%" stop-color="#131C2E" />
    </linearGradient>
    <linearGradient id="pcborder-eventease-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#60A5FA" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#E5B2A3" stop-opacity="0.3" />
    </linearGradient>
    <linearGradient id="pcsheen-eventease-dark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.07" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
    <clipPath id="pcclip-eventease-dark">
      <rect x="1" y="1" width="582" height="292" rx="18" />
    </clipPath>
  </defs>

  <g clip-path="url(#pcclip-eventease-dark)">
    <rect x="1" y="1" width="582" height="292" rx="18" fill="url(#pcbg-eventease-dark)" />
    <!-- Ambient Orbs -->
    <circle cx="95" cy="52" r="115" fill="#60A5FA" opacity="0.24" />
    <circle cx="510" cy="245" r="120" fill="#B76E79" opacity="0.2" />

    <!-- Frosted Glass Card Surface -->
    <rect x="10" y="10" width="564" height="274" rx="15" fill="#111827" fill-opacity="0.74" stroke="url(#pcborder-eventease-dark)" stroke-width="1.4" />

    <!-- Top Animated Accent Line -->
    <rect x="26" y="10" width="130" height="3" rx="1.5" fill="#60A5FA">
      <animate attributeName="width" values="110;175;110" dur="5s" begin="4.2s" repeatCount="indefinite" />
    </rect>

    <!-- Diagonal Glass Sheen -->
    <rect x="-180" y="10" width="140" height="274" fill="url(#pcsheen-eventease-dark)" transform="skewX(-18)">
      <animate attributeName="x" values="-180;780" dur="7.5s" begin="4.2s" repeatCount="indefinite" />
    </rect>

    <!-- Top Row: Category Pill + Status Pill -->
    <rect x="26" y="26" width="96" height="24" rx="12" fill="#60A5FA" fill-opacity="0.2" stroke="#60A5FA" stroke-opacity="0.4" stroke-width="1" />
    <text x="74.0" y="41.5" text-anchor="middle" font-family="'Cascadia Code', ui-monospace, monospace" font-size="10" font-weight="700" fill="#60A5FA">FULL STACK</text>

    <rect x="454" y="26" width="104" height="24" rx="12" fill="#064E3B" stroke="#34D399" stroke-opacity="0.45" stroke-width="1" />
    <circle cx="468" cy="38" r="3.5" fill="#34D399">
      <animate attributeName="opacity" values="1;0.35;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="478" y="41.5" font-family="'Cascadia Code', ui-monospace, monospace" font-size="9.5" font-weight="700" fill="#6EE7B7">PUBLIC REPO</text>

    <!-- Title & Subtitle -->
    <text x="26" y="78" font-family="'Segoe UI', system-ui, sans-serif" font-size="19" font-weight="800" fill="#F8FAFC">EventEase — Event Check-In</text>
    <text x="26" y="98" font-family="'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#E5B2A3">Team NexGen Coders (Team Leader)</text>

    <!-- Description -->
    <text x="26" y="121" font-family="'Segoe UI', system-ui, sans-serif" font-size="12.2" fill="#CBD5E1">Real-time college event registration and check-in platform</text>
    <text x="26" y="138" font-family="'Segoe UI', system-ui, sans-serif" font-size="12.2" fill="#CBD5E1">replacing scattered spreadsheets.</text>

    <!-- Inner Frosted Glass Feature Well -->
    <rect x="26" y="150" width="532" height="88" rx="11" fill="#0D1526" fill-opacity="0.82" stroke="#24324A" stroke-width="1" />
    <circle cx="42" cy="168" r="3" fill="#60A5FA" /><text x="54" y="172" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="500" fill="#E2E8F0">Capacity-aware registration &amp; unique check-in pass flow</text><circle cx="42" cy="192" r="3" fill="#60A5FA" /><text x="54" y="196" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="500" fill="#E2E8F0">Type-safe React + TypeScript frontend &amp; API backend</text><circle cx="42" cy="216" r="3" fill="#60A5FA" /><text x="54" y="220" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="500" fill="#E2E8F0">Led architecture &amp; sprint delivery as Team Leader</text>

    <!-- Tech Stack Chips -->
    <rect x="26" y="252" width="92" height="24" rx="7" fill="#1E293B" stroke="#334155" stroke-width="1" /><text x="72.0" y="267.5" text-anchor="middle" font-family="'Cascadia Code', ui-monospace, monospace" font-size="10.5" font-weight="600" fill="#E2E8F0">TypeScript</text><rect x="126.0" y="252" width="56" height="24" rx="7" fill="#1E293B" stroke="#334155" stroke-width="1" /><text x="154.0" y="267.5" text-anchor="middle" font-family="'Cascadia Code', ui-monospace, monospace" font-size="10.5" font-weight="600" fill="#E2E8F0">React</text><rect x="190.0" y="252" width="70" height="24" rx="7" fill="#1E293B" stroke="#334155" stroke-width="1" /><text x="225.2" y="267.5" text-anchor="middle" font-family="'Cascadia Code', ui-monospace, monospace" font-size="10.5" font-weight="600" fill="#E2E8F0">Drizzle</text><rect x="268.4" y="252" width="78" height="24" rx="7" fill="#1E293B" stroke="#334155" stroke-width="1" /><text x="307.2" y="267.5" text-anchor="middle" font-family="'Cascadia Code', ui-monospace, monospace" font-size="10.5" font-weight="600" fill="#E2E8F0">Supabase</text>

    <!-- CTA Pill -->
    <rect x="444" y="250" width="114" height="26" rx="8" fill="#60A5FA" fill-opacity="0.22" stroke="#60A5FA" stroke-opacity="0.5" stroke-width="1" />
    <text x="501" y="266.5" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" fill="#60A5FA">View Repo →</text>

    <rect x="1" y="1" width="582" height="292" rx="18" fill="none" stroke="#283548" stroke-width="1.2" />
  </g>
</svg>