<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 584 294" width="100%" role="img" aria-label="Farmer Bidding &amp; Marketplace - Direct Agricultural E-Commerce Portal">
  <defs>
    <linearGradient id="pcbg-farmar-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120" />
      <stop offset="100%" stop-color="#131C2E" />
    </linearGradient>
    <linearGradient id="pcborder-farmar-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#E5B2A3" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#E5B2A3" stop-opacity="0.3" />
    </linearGradient>
    <linearGradient id="pcsheen-farmar-dark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.07" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
    <clipPath id="pcclip-farmar-dark">
      <rect x="1" y="1" width="582" height="292" rx="18" />
    </clipPath>
  </defs>

  <g clip-path="url(#pcclip-farmar-dark)">
    <rect x="1" y="1" width="582" height="292" rx="18" fill="url(#pcbg-farmar-dark)" />
    <!-- Ambient Orbs -->
    <circle cx="95" cy="52" r="115" fill="#E5B2A3" opacity="0.24" />
    <circle cx="510" cy="245" r="120" fill="#B76E79" opacity="0.2" />

    <!-- Frosted Glass Card Surface -->
    <rect x="10" y="10" width="564" height="274" rx="15" fill="#111827" fill-opacity="0.74" stroke="url(#pcborder-farmar-dark)" stroke-width="1.4" />

    <!-- Top Animated Accent Line -->
    <rect x="26" y="10" width="130" height="3" rx="1.5" fill="#E5B2A3">
      <animate attributeName="width" values="110;175;110" dur="5s" begin="3.6s" repeatCount="indefinite" />
    </rect>

    <!-- Diagonal Glass Sheen -->
    <rect x="-180" y="10" width="140" height="274" fill="url(#pcsheen-farmar-dark)" transform="skewX(-18)">
      <animate attributeName="x" values="-180;780" dur="7.5s" begin="3.6s" repeatCount="indefinite" />
    </rect>

    <!-- Top Row: Category Pill + Status Pill -->
    <rect x="26" y="26" width="92" height="24" rx="12" fill="#E5B2A3" fill-opacity="0.2" stroke="#E5B2A3" stroke-opacity="0.4" stroke-width="1" />
    <text x="72.0" y="41.5" text-anchor="middle" font-family="'Cascadia Code', ui-monospace, monospace" font-size="10" font-weight="700" fill="#E5B2A3">AGRI-TECH</text>

    <rect x="454" y="26" width="104" height="24" rx="12" fill="#064E3B" stroke="#34D399" stroke-opacity="0.45" stroke-width="1" />
    <circle cx="468" cy="38" r="3.5" fill="#34D399">
      <animate attributeName="opacity" values="1;0.35;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="478" y="41.5" font-family="'Cascadia Code', ui-monospace, monospace" font-size="9.5" font-weight="700" fill="#6EE7B7">PUBLIC REPO</text>

    <!-- Title & Subtitle -->
    <text x="26" y="78" font-family="'Segoe UI', system-ui, sans-serif" font-size="19" font-weight="800" fill="#F8FAFC">Farmer Bidding &amp; Marketplace</text>
    <text x="26" y="98" font-family="'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#E5B2A3">Direct Agricultural E-Commerce Portal</text>

    <!-- Description -->
    <text x="26" y="121" font-family="'Segoe UI', system-ui, sans-serif" font-size="12.2" fill="#CBD5E1">Two-sided marketplace connecting farmers directly with</text>
    <text x="26" y="138" font-family="'Segoe UI', system-ui, sans-serif" font-size="12.2" fill="#CBD5E1">wholesale produce buyers.</text>

    <!-- Inner Frosted Glass Feature Well -->
    <rect x="26" y="150" width="532" height="88" rx="11" fill="#0D1526" fill-opacity="0.82" stroke="#24324A" stroke-width="1" />
    <circle cx="42" cy="168" r="3" fill="#E5B2A3" /><text x="54" y="172" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="500" fill="#E2E8F0">Transparent open pricing bids eliminating broker fees</text><circle cx="42" cy="192" r="3" fill="#E5B2A3" /><text x="54" y="196" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="500" fill="#E2E8F0">Live crop inventory listings with grade &amp; photo upload</text><circle cx="42" cy="216" r="3" fill="#E5B2A3" /><text x="54" y="220" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="500" fill="#E2E8F0">Lightweight mobile-friendly UI for low-bandwidth areas</text>

    <!-- Tech Stack Chips -->
    <rect x="26" y="252" width="48" height="24" rx="7" fill="#1E293B" stroke="#334155" stroke-width="1" /><text x="50.0" y="267.5" text-anchor="middle" font-family="'Cascadia Code', ui-monospace, monospace" font-size="10.5" font-weight="600" fill="#E2E8F0">PHP</text><rect x="82" y="252" width="92" height="24" rx="7" fill="#1E293B" stroke="#334155" stroke-width="1" /><text x="128.0" y="267.5" text-anchor="middle" font-family="'Cascadia Code', ui-monospace, monospace" font-size="10.5" font-weight="600" fill="#E2E8F0">JavaScript</text><rect x="182.0" y="252" width="56" height="24" rx="7" fill="#1E293B" stroke="#334155" stroke-width="1" /><text x="210.0" y="267.5" text-anchor="middle" font-family="'Cascadia Code', ui-monospace, monospace" font-size="10.5" font-weight="600" fill="#E2E8F0">HTML5</text><rect x="246.0" y="252" width="49" height="24" rx="7" fill="#1E293B" stroke="#334155" stroke-width="1" /><text x="270.4" y="267.5" text-anchor="middle" font-family="'Cascadia Code', ui-monospace, monospace" font-size="10.5" font-weight="600" fill="#E2E8F0">CSS3</text><rect x="302.8" y="252" width="56" height="24" rx="7" fill="#1E293B" stroke="#334155" stroke-width="1" /><text x="330.8" y="267.5" text-anchor="middle" font-family="'Cascadia Code', ui-monospace, monospace" font-size="10.5" font-weight="600" fill="#E2E8F0">MySQL</text>

    <!-- CTA Pill -->
    <rect x="444" y="250" width="114" height="26" rx="8" fill="#E5B2A3" fill-opacity="0.22" stroke="#E5B2A3" stroke-opacity="0.5" stroke-width="1" />
    <text x="501" y="266.5" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" fill="#E5B2A3">View Repo →</text>

    <rect x="1" y="1" width="582" height="292" rx="18" fill="none" stroke="#283548" stroke-width="1.2" />
  </g>
</svg>