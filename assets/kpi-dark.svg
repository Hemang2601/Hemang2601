<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 116" width="100%" role="img" aria-label="Hemang Lakhadiya Key Milestones">
  <defs>
    <linearGradient id="kpiBarDark" x1="0%" y1="0%" x2="100%" y2="0%">
