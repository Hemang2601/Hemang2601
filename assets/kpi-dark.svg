    </circle>
    <text x="18" y="42" font-family="'Segoe UI', system-ui, sans-serif" font-weight="800" font-size="26" fill="#F8FAFC">14+</text>
    <text x="18" y="66" font-family="'Segoe UI', system-ui, sans-serif" font-weight="700" font-size="13" fill="#E5B2A3">Software Projects</text>
    <text x="18" y="86" font-family="'Cascadia Code', ui-monospace, monospace" font-size="10.5" fill="#8B949E">Web • Mobile • APIs</text>
  </g>

