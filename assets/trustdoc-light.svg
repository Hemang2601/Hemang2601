<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="100%" role="img" aria-label="TrustDoc Security Architecture Pipeline">
  <defs>
    <linearGradient id="tdBgLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FAF7F4" />
    </linearGradient>
    <linearGradient id="tdPipe" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="50%" stop-color="#B76E79" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <pattern id="tdDotsLight" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#CBD5E1" opacity="0.55" />
    </pattern>
  </defs>

  <rect x="1" y="1" width="1198" height="218" rx="16" fill="url(#tdBgLight)" stroke="#E5D3CE" stroke-width="1.5" />
  <rect x="1" y="1" width="1198" height="218" rx="16" fill="url(#tdDotsLight)" />

  <!-- Header Row -->
  <g transform="translate(28, 30)">
    <rect x="0" y="-16" width="236" height="24" rx="12" fill="#FDF2F0" stroke="#E8C9C1" stroke-width="1" />
    <circle cx="14" cy="-4" r="3.5" fill="#B76E79">
      <animate attributeName="opacity" values="1;0.35;1" dur="1.8s" repeatCount="indefinite" />
    </circle>
    <text x="26" y="0" font-family="'Cascadia Code', ui-monospace, monospace" font-size="10.5" font-weight="700" fill="#A65D68">FLAGSHIP MCA SEM 4 • PROTOTYPE</text>
    <text x="252" y="1" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="800" fill="#0F172A">TrustDoc — Cryptographic Document Transfer &amp; Integrity Pipeline</text>
    <text x="1142" y="1" text-anchor="end" font-family="'Cascadia Code', ui-monospace, monospace" font-size="11" fill="#2563EB" font-weight="600">React • TS • Node • Express • MongoDB</text>
  </g>

  <!-- Animated Pipeline Track -->
  <line x1="150" y1="124" x2="1050" y2="124" stroke="#E2E8F0" stroke-width="3" />
  <line x1="150" y1="124" x2="1050" y2="124" stroke="url(#tdPipe)" stroke-width="3" stroke-dasharray="10 10">
    <animate attributeName="stroke-dashoffset" values="0;-40" dur="1.6s" repeatCount="indefinite" />
  </line>

  <!-- Flowing Data Packets -->
  <circle cy="124" r="5" fill="#2563EB">
    <animate attributeName="cx" values="150;1050" dur="3.8s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="3.8s" repeatCount="indefinite" />
  </circle>
  <circle cy="124" r="4.5" fill="#B76E79">
    <animate attributeName="cx" values="150;1050" dur="3.8s" begin="1.9s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="3.8s" begin="1.9s" repeatCount="indefinite" />
  </circle>

  <!-- Node 1 -->
  <g transform="translate(28, 66)">
    <rect x="0" y="0" width="262" height="122" rx="12" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1.5" />
    <rect x="0" y="0" width="262" height="4" rx="2" fill="#2563EB" />
    <text x="18" y="28" font-family="'Cascadia Code', ui-monospace, monospace" font-size="11" font-weight="700" fill="#2563EB">01 • PAYLOAD ENCRYPTION</text>
    <text x="18" y="54" font-family="'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="800" fill="#0F172A">AES-256 Encryption</text>
    <text x="18" y="77" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#475569">Zero-knowledge client encryption</text>
    <text x="18" y="96" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#475569">before payload leaves browser</text>
  </g>

  <!-- Node 2 -->
  <g transform="translate(322, 66)">
    <rect x="0" y="0" width="262" height="122" rx="12" fill="#FFFFFF" stroke="#E5CFC9" stroke-width="1.5" />
    <rect x="0" y="0" width="262" height="4" rx="2" fill="#B76E79" />
    <text x="18" y="28" font-family="'Cascadia Code', ui-monospace, monospace" font-size="11" font-weight="700" fill="#A65D68">02 • AUTHENTICITY</text>
    <text x="18" y="54" font-family="'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="800" fill="#0F172A">RSA Digital Signatures</text>
    <text x="18" y="77" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#475569">Cryptographic sender verification</text>
    <text x="18" y="96" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#475569">&amp; strict non-repudiation</text>
  </g>

  <!-- Node 3 -->
  <g transform="translate(616, 66)">
    <rect x="0" y="0" width="262" height="122" rx="12" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1.5" />
    <rect x="0" y="0" width="262" height="4" rx="2" fill="#2563EB" />
    <text x="18" y="28" font-family="'Cascadia Code', ui-monospace, monospace" font-size="11" font-weight="700" fill="#2563EB">03 • TAMPER DETECTION</text>
    <text x="18" y="54" font-family="'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="800" fill="#0F172A">SHA-256 Integrity Check</text>
    <text x="18" y="77" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#475569">Instant cryptographic digest check</text>
    <text x="18" y="96" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#475569">flagging single-bit alterations</text>
  </g>

  <!-- Node 4 -->
  <g transform="translate(910, 66)">
    <rect x="0" y="0" width="262" height="122" rx="12" fill="#FFFFFF" stroke="#E5CFC9" stroke-width="1.5" />
    <rect x="0" y="0" width="262" height="4" rx="2" fill="#B76E79" />
    <text x="18" y="28" font-family="'Cascadia Code', ui-monospace, monospace" font-size="11" font-weight="700" fill="#A65D68">04 • GOVERNANCE</text>
    <text x="18" y="54" font-family="'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="800" fill="#0F172A">RBAC &amp; Audit Logging</text>
    <text x="18" y="77" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#475569">Granular view/download rights</text>
    <text x="18" y="96" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#475569">&amp; immutable document trail</text>
  </g>
</svg>
