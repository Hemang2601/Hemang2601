<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 136" width="100%" role="img" aria-label="Engineering Identity Dashboard: 1st Place Code Carnival 3.0, 14+ Projects, 5x Hackathons, 16 Certifications, MCA 8.83, BCA 9.32">
