<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" role="img" aria-label="Hemang Lakhadiya - Full Stack Developer and Mobile Architect">
  <defs>
    <linearGradient id="bgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117" />
      <stop offset="55%" stop-color="#111827" />
      <stop offset="100%" stop-color="#161B22" />
    </linearGradient>
    <linearGradient id="roseGoldDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D49B8C" />
      <stop offset="50%" stop-color="#E5B2A3" />
      <stop offset="100%" stop-color="#C88A78" />
    </linearGradient>
    <linearGradient id="brandBlueDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <pattern id="dotGridDark" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#30363D" opacity="0.8" />
    </pattern>
    <radialGradient id="warmGlowDark" cx="80%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#C88A78" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="coolGlowDark" cx="15%" cy="85%" r="50%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Base Card -->
  <rect x="1" y="1" width="1198" height="318" rx="18" fill="url(#bgDark)" stroke="#30363D" stroke-width="1.5" />
  <rect x="1" y="1" width="1198" height="318" rx="18" fill="url(#dotGridDark)" />
  <rect x="1" y="1" width="1198" height="318" rx="18" fill="url(#warmGlowDark)" />
  <rect x="1" y="1" width="1198" height="318" rx="18" fill="url(#coolGlowDark)" />

  <!-- Top Accent Hairline -->
  <rect x="44" y="1" width="220" height="3" rx="1.5" fill="url(#roseGoldDark)" />

  <!-- HL Monogram + Status Eyebrow -->
  <g transform="translate(52, 42)">
    <rect x="0" y="0" width="42" height="42" rx="11" fill="url(#brandBlueDark)" />
    <text x="21" y="27" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-weight="800" font-size="18" fill="#FFFFFF" letter-spacing="0.5">HL</text>

    <rect x="56" y="7" width="268" height="28" rx="14" fill="#161B22" stroke="#3E3235" stroke-width="1.2" />
    <circle cx="73" cy="21" r="4" fill="#E5B2A3" />
    <text x="86" y="25.5" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-weight="600" font-size="12" fill="#CBD5E1">App Full Stack Intern @ Zennaxx Technology</text>
  </g>

  <!-- Main Identity -->
  <g transform="translate(52, 134)">
    <text x="0" y="0" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-weight="800" font-size="40" fill="#F8FAFC" letter-spacing="1.2">HEMANG LAKHADIYA</text>
    <text x="0" y="34" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-weight="700" font-size="19" fill="#E5B2A3" letter-spacing="0.3">Full Stack Developer  |  Mobile Architect</text>
    <rect x="0" y="50" width="76" height="2.5" rx="1.25" fill="url(#roseGoldDark)" />
    <text x="0" y="76" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-weight="500" font-size="15.5" fill="#94A3B8">Building Scalable Applications &amp; Digital Experiences</text>
  </g>

