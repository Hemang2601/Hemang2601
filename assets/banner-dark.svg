<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" role="img" aria-label="Hemang Lakhadiya - Full Stack Developer and Mobile Architect">
  <defs>
    <linearGradient id="bgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117" />
      <stop offset="52%" stop-color="#111827" />
      <stop offset="100%" stop-color="#161B22" />
    </linearGradient>
    <linearGradient id="roseGoldDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D49B8C" />
      <stop offset="50%" stop-color="#E5B2A3" />
      <stop offset="100%" stop-color="#C88A78" />
    </linearGradient>
    <linearGradient id="shimmerDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E5B2A3" stop-opacity="0" />
      <stop offset="50%" stop-color="#E5B2A3" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#E5B2A3" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="brandBlueDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <pattern id="dotGridDark" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#30363D" opacity="0.8" />
    </pattern>
    <radialGradient id="warmGlowDark" cx="82%" cy="22%" r="55%">
      <stop offset="0%" stop-color="#C88A78" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="coolGlowDark" cx="14%" cy="86%" r="52%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Base Card -->
  <rect x="1" y="1" width="1198" height="338" rx="18" fill="url(#bgDark)" stroke="#30363D" stroke-width="1.5" />
  <rect x="1" y="1" width="1198" height="338" rx="18" fill="url(#dotGridDark)" />
  <rect x="1" y="1" width="1198" height="338" rx="18" fill="url(#warmGlowDark)" />
  <rect x="1" y="1" width="1198" height="338" rx="18" fill="url(#coolGlowDark)" />

  <!-- Subtle Animated Ambient Orbits -->
  <g opacity="0.45">
    <circle cx="670" cy="70" r="36" fill="none" stroke="#5E4347" stroke-width="1" stroke-dasharray="4 6">
      <animateTransform attributeName="transform" type="rotate" from="0 670 70" to="360 670 70" dur="28s" repeatCount="indefinite" />
    </circle>
    <circle cx="670" cy="70" r="52" fill="none" stroke="#1E3A8A" stroke-width="1" stroke-dasharray="3 8">
      <animateTransform attributeName="transform" type="rotate" from="360 670 70" to="0 670 70" dur="36s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Top Static + Animated Shimmer Accent -->
  <rect x="44" y="1" width="240" height="3" rx="1.5" fill="url(#roseGoldDark)" />
  <rect x="44" y="1" width="180" height="3" rx="1.5" fill="url(#shimmerDark)">
    <animate attributeName="x" values="44;970;44" dur="7s" repeatCount="indefinite" />
  </rect>

  <!-- HL Monogram + Live Status Pill -->
  <g transform="translate(52, 42)">
    <rect x="0" y="0" width="44" height="44" rx="12" fill="url(#brandBlueDark)" />
    <text x="22" y="28.5" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-weight="800" font-size="18.5" fill="#FFFFFF" letter-spacing="0.5">HL</text>

    <rect x="58" y="8" width="278" height="28" rx="14" fill="#161B22" stroke="#4D3539" stroke-width="1.2" />
    <circle cx="75" cy="22" r="4" fill="#E5B2A3">
      <animate attributeName="opacity" values="1;0.45;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <circle cx="75" cy="22" r="4" fill="none" stroke="#E5B2A3" stroke-width="1.5">
      <animate attributeName="r" values="4;10" dur="2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.7;0" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="89" y="26.5" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-weight="600" font-size="12" fill="#CBD5E1">App Full Stack Intern @ Zennaxx Technology</text>
  </g>

  <!-- Main Identity -->
  <g transform="translate(52, 138)">
    <text x="0" y="0" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-weight="800" font-size="42" fill="#F8FAFC" letter-spacing="1.2">HEMANG LAKHADIYA</text>
    <text x="0" y="36" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-weight="700" font-size="19.5" fill="#E5B2A3" letter-spacing="0.3">Full Stack Developer  |  Mobile Architect</text>
    <rect x="0" y="52" width="88" height="3" rx="1.5" fill="url(#roseGoldDark)">
      <animate attributeName="width" values="72;128;72" dur="4.5s" repeatCount="indefinite" />
    </rect>
    <text x="0" y="80" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-weight="500" font-size="15.5" fill="#94A3B8">Building Scalable Applications &amp; Digital Experiences</text>
  </g>

  <!-- Bottom Verified Metadata Pills -->
  <g transform="translate(52, 260)" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600">
    <rect x="0" y="0" width="166" height="34" rx="9" fill="#161B22" stroke="#30363D" stroke-width="1" />
    <text x="16" y="21.5" fill="#E2E8F0">Rajkot, Gujarat, India</text>

    <rect x="178" y="0" width="202" height="34" rx="9" fill="#161B22" stroke="#30363D" stroke-width="1" />
    <text x="194" y="21.5" fill="#E2E8F0">MCA @ Marwadi University</text>

    <rect x="392" y="0" width="218" height="34" rx="9" fill="#1F191C" stroke="#4D3539" stroke-width="1" />
    <text x="408" y="21.5" fill="#E5B2A3">1st Place • Code Carnival 3.0</text>
  </g>

  <!-- Right Side: Animated Portfolio-Inspired Code Identity Card -->
  <g transform="translate(730, 38)">
    <rect x="0" y="0" width="422" height="264" rx="14" fill="#0D1117" stroke="#30363D" stroke-width="1.4" />
    <!-- Active Top Line Glow -->
    <rect x="24" y="0" width="90" height="2" rx="1" fill="#60A5FA" opacity="0.85">
      <animate attributeName="x" values="24;308;24" dur="6s" repeatCount="indefinite" />
    </rect>
    <!-- Window Header -->
    <rect x="0" y="0" width="422" height="38" rx="14" fill="#161B22" />
    <rect x="0" y="24" width="422" height="14" fill="#161B22" />
    <line x1="0" y1="38" x2="422" y2="38" stroke="#30363D" stroke-width="1" />
    <circle cx="20" cy="19" r="5" fill="#FB7185" />
    <circle cx="36" cy="19" r="5" fill="#FBBF24" />
    <circle cx="52" cy="19" r="5" fill="#4ADE80" />
    <text x="72" y="23" font-family="'Cascadia Code', 'JetBrains Mono', ui-monospace, monospace" font-size="11.5" font-weight="600" fill="#8B949E">hemang-profile.ts</text>
    <rect x="348" y="10" width="58" height="18" rx="9" fill="#251C1F" stroke="#53383E" stroke-width="1" />
    <text x="377" y="22.5" text-anchor="middle" font-family="'Cascadia Code', ui-monospace, monospace" font-size="10" font-weight="700" fill="#E5B2A3">ACTIVE</text>

    <!-- Highlight Row Pulse -->
    <rect x="12" y="169" width="398" height="22" rx="5" fill="#1E293B">
      <animate attributeName="opacity" values="0.35;0.85;0.35" dur="3.5s" repeatCount="indefinite" />
    </rect>

    <!-- Code Lines -->
    <g transform="translate(20, 64)" font-family="'Cascadia Code', 'JetBrains Mono', ui-monospace, monospace" font-size="12">
      <text x="0" y="0" fill="#60A5FA" font-weight="600">const <tspan fill="#F8FAFC">developer</tspan> <tspan fill="#8B949E">=</tspan> <tspan fill="#8B949E">{</tspan></text>
      <text x="16" y="24" fill="#8B949E">role: <tspan fill="#E5B2A3">"Full Stack &amp; Mobile Architect"</tspan>,</text>
      <text x="16" y="48" fill="#8B949E">web: <tspan fill="#E2E8F0">["Node.js", "Express", "Laravel"]</tspan>,</text>
      <text x="16" y="72" fill="#8B949E">mobile: <tspan fill="#E2E8F0">["Flutter", "Dart", "Android"]</tspan>,</text>
      <text x="16" y="96" fill="#8B949E">data: <tspan fill="#E2E8F0">["MongoDB", "MySQL", "SQL"]</tspan>,</text>
      <text x="16" y="120" fill="#60A5FA">flagship: <tspan fill="#93C5FD" font-weight="600">"TrustDoc (AES-256 &amp; RSA)"</tspan>,</text>
      <text x="16" y="144" fill="#8B949E">academic: <tspan fill="#E2E8F0">"MCA 8.83 | BCA 9.32"</tspan>,</text>
      <text x="16" y="168" fill="#8B949E">award: <tspan fill="#E5B2A3">"1st Place • Code Carnival 3.0"</tspan></text>
      <text x="0" y="190" fill="#8B949E">};</text>
      <!-- Blinking Cursor -->
      <rect x="20" y="179" width="7" height="14" rx="1" fill="#E5B2A3">
        <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.49;0.5;1" dur="1.1s" repeatCount="indefinite" />
      </rect>
    </g>
  </g>
</svg>
