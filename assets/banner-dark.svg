    <rect x="0" y="0" width="412" height="36" rx="14" fill="#161B22" />
    <rect x="0" y="22" width="412" height="14" fill="#161B22" />
    <line x1="0" y1="36" x2="412" y2="36" stroke="#30363D" stroke-width="1" />
    <circle cx="20" cy="18" r="5" fill="#FB7185" />
    <circle cx="36" cy="18" r="5" fill="#FBBF24" />
    <circle cx="52" cy="18" r="5" fill="#4ADE80" />
    <text x="72" y="22" font-family="'Cascadia Code', 'JetBrains Mono', ui-monospace, monospace" font-size="11.5" font-weight="600" fill="#8B949E">hemang-profile.ts</text>
    <rect x="342" y="9" width="54" height="18" rx="9" fill="#251C1F" stroke="#53383E" stroke-width="1" />
    <text x="369" y="21.5" text-anchor="middle" font-family="'Cascadia Code', ui-monospace, monospace" font-size="10" font-weight="700" fill="#E5B2A3">v3.0</text>

    <!-- Code Lines -->
    <g transform="translate(20, 62)" font-family="'Cascadia Code', 'JetBrains Mono', ui-monospace, monospace" font-size="12">
      <text x="0" y="0" fill="#60A5FA" font-weight="600">const <tspan fill="#F8FAFC">developer</tspan> <tspan fill="#8B949E">=</tspan> <tspan fill="#8B949E">{</tspan></text>
      <text x="16" y="25" fill="#8B949E">focus: <tspan fill="#E5B2A3">"Backend, APIs &amp; Security"</tspan>,</text>
      <text x="16" y="50" fill="#8B949E">web: <tspan fill="#E2E8F0">["Node.js", "Express", "Laravel"]</tspan>,</text>
      <text x="16" y="75" fill="#8B949E">mobile: <tspan fill="#E2E8F0">["Flutter", "Dart", "Android"]</tspan>,</text>
      <text x="16" y="100" fill="#8B949E">data: <tspan fill="#E2E8F0">["MongoDB", "MySQL", "SQL"]</tspan>,</text>
      <text x="16" y="125" fill="#8B949E">flagship: <tspan fill="#60A5FA">"TrustDoc (MCA Sem 4)"</tspan>,</text>
      <text x="16" y="150" fill="#8B949E">academic: <tspan fill="#E2E8F0">"MCA 8.83 | BCA 9.32"</tspan></text>
      <text x="0" y="172" fill="#8B949E">};</text>
    </g>
