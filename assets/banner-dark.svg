    <text x="16" y="20.5" fill="#E2E8F0">Rajkot, Gujarat, India</text>

    <rect x="178" y="0" width="198" height="32" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1" />
    <text x="194" y="20.5" fill="#E2E8F0">MCA @ Marwadi University</text>

    <rect x="388" y="0" width="212" height="32" rx="8" fill="#1F191C" stroke="#4D3539" stroke-width="1" />
    <text x="404" y="20.5" fill="#E5B2A3">1st Place • Code Carnival 3.0</text>
  </g>

