<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 232" width="100%" role="img" aria-label="TrustDoc Security Architecture Blueprint — AES-256, RSA Signatures, SHA-256, RBAC and Audit Logging">
  <defs>
    <linearGradient id="td-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1020" />
      <stop offset="100%" stop-color="#151D32" />
    </linearGradient>
    <linearGradient id="td-pipe" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#35D9FF" />
      <stop offset="50%" stop-color="#9B8CFF" />
      <stop offset="100%" stop-color="#FFBF69" />
    </linearGradient>
    <pattern id="td-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#2A3759" opacity="0.7" />
    </pattern>
  </defs>

  <rect x="1" y="1" width="1198" height="230" rx="18" fill="url(#td-bg)" stroke="#2B395B" stroke-width="1.5" />
  <rect x="1" y="1" width="1198" height="230" rx="18" fill="url(#td-grid)" />
  <rect x="36" y="1" width="260" height="3" rx="1.5" fill="url(#td-pipe)" />

  <!-- Top Header Strip -->
  <g transform="translate(28, 32)">
    <rect x="0" y="-17" width="248" height="24" rx="12" fill="#18233F" stroke="#35D9FF" stroke-opacity="0.55" stroke-width="1" />
    <circle cx="14" cy="-5" r="3.5" fill="#35D9FF" />
    <text x="26" y="-1" font-family="'Cascadia Code', ui-monospace, monospace" font-size="10.2" font-weight="700" fill="#35D9FF">FLAGSHIP MCA PROJECT • VERIFIED</text>
    <text x="264" y="0" font-family="'Segoe UI', system-ui, sans-serif" font-size="15" font-weight="800" fill="#F4F7FF">TrustDoc — Cryptographic Document Security Pipeline</text>
    <text x="1144" y="0" text-anchor="end" font-family="'Cascadia Code', ui-monospace, monospace" font-size="11" font-weight="600" fill="#9B8CFF">React • TypeScript • Node • Express • MongoDB</text>
  </g>

  <!-- Circuit Connectors -->
  <line x1="160" y1="132" x2="1040" y2="132" stroke="url(#td-pipe)" stroke-width="2.5" stroke-dasharray="6 6" opacity="0.65" />

  <!-- Node 1 -->
  <g transform="translate(28, 68)">
    <rect x="0" y="0" width="262" height="132" rx="13" fill="#11182C" stroke="#35D9FF" stroke-opacity="0.55" stroke-width="1.3" />
    <rect x="0" y="0" width="262" height="4" rx="2" fill="#35D9FF" />
    <text x="18" y="30" font-family="'Cascadia Code', ui-monospace, monospace" font-size="10.5" font-weight="700" fill="#35D9FF">01 • PAYLOAD ENCRYPTION</text>
    <text x="18" y="58" font-family="'Segoe UI', system-ui, sans-serif" font-size="16.5" font-weight="800" fill="#F4F7FF">AES-256 Encryption</text>
    <text x="18" y="84" font-family="'Segoe UI', system-ui, sans-serif" font-size="12.2" fill="#CBD5E1">Client-side cryptographic protection</text>
    <text x="18" y="103" font-family="'Segoe UI', system-ui, sans-serif" font-size="12.2" fill="#CBD5E1">for zero-exposure file transfer</text>
  </g>

  <!-- Node 2 -->
  <g transform="translate(322, 68)">
    <rect x="0" y="0" width="262" height="132" rx="13" fill="#11182C" stroke="#9B8CFF" stroke-opacity="0.55" stroke-width="1.3" />
    <rect x="0" y="0" width="262" height="4" rx="2" fill="#9B8CFF" />
    <text x="18" y="30" font-family="'Cascadia Code', ui-monospace, monospace" font-size="10.5" font-weight="700" fill="#9B8CFF">02 • AUTHENTICITY</text>
    <text x="18" y="58" font-family="'Segoe UI', system-ui, sans-serif" font-size="16.5" font-weight="800" fill="#F4F7FF">RSA Digital Signatures</text>
    <text x="18" y="84" font-family="'Segoe UI', system-ui, sans-serif" font-size="12.2" fill="#CBD5E1">Asymmetric sender identity proof</text>
    <text x="18" y="103" font-family="'Segoe UI', system-ui, sans-serif" font-size="12.2" fill="#CBD5E1">&amp; verifiable non-repudiation</text>
  </g>

  <!-- Node 3 -->
  <g transform="translate(616, 68)">
    <rect x="0" y="0" width="262" height="132" rx="13" fill="#11182C" stroke="#35D9FF" stroke-opacity="0.55" stroke-width="1.3" />
    <rect x="0" y="0" width="262" height="4" rx="2" fill="#35D9FF" />
    <text x="18" y="30" font-family="'Cascadia Code', ui-monospace, monospace" font-size="10.5" font-weight="700" fill="#35D9FF">03 • INTEGRITY VERIFICATION</text>
    <text x="18" y="58" font-family="'Segoe UI', system-ui, sans-serif" font-size="16.5" font-weight="800" fill="#F4F7FF">SHA-256 Tamper Check</text>
    <text x="18" y="84" font-family="'Segoe UI', system-ui, sans-serif" font-size="12.2" fill="#CBD5E1">Cryptographic digest verification</text>
    <text x="18" y="103" font-family="'Segoe UI', system-ui, sans-serif" font-size="12.2" fill="#CBD5E1">detecting any unauthorized edit</text>
  </g>

  <!-- Node 4 -->
  <g transform="translate(910, 68)">
    <rect x="0" y="0" width="262" height="132" rx="13" fill="#11182C" stroke="#FFBF69" stroke-opacity="0.55" stroke-width="1.3" />
    <rect x="0" y="0" width="262" height="4" rx="2" fill="#FFBF69" />
    <text x="18" y="30" font-family="'Cascadia Code', ui-monospace, monospace" font-size="10.5" font-weight="700" fill="#FFBF69">04 • ACCESS &amp; TRACEABILITY</text>
    <text x="18" y="58" font-family="'Segoe UI', system-ui, sans-serif" font-size="16.5" font-weight="800" fill="#F4F7FF">RBAC &amp; Audit Logging</text>
    <text x="18" y="84" font-family="'Segoe UI', system-ui, sans-serif" font-size="12.2" fill="#CBD5E1">Granular view/download rules &amp;</text>
    <text x="18" y="103" font-family="'Segoe UI', system-ui, sans-serif" font-size="12.2" fill="#CBD5E1">complete immutable activity logs</text>
  </g>
</svg>
