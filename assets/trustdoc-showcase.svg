<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 244" width="100%" role="img" aria-label="TrustDoc Flagship Architecture: Document Creation &amp; Upload, AES-256-GCM Encryption, RSA-PSS &amp; SHA-256 Verification, RBAC &amp; Real-Time SOC">
  <defs>
    <linearGradient id="tdb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080D1A" />
      <stop offset="100%" stop-color="#111A2D" />
    </linearGradient>
    <linearGradient id="tdl" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#37DFFF" />
      <stop offset="50%" stop-color="#9A86FF" />
      <stop offset="100%" stop-color="#F3C77B" />
    </linearGradient>
    <pattern id="tdg" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#233252" opacity="0.7" />
    </pattern>
  </defs>

  <rect x="1" y="1" width="1198" height="242" rx="18" fill="url(#tdb)" stroke="#233252" stroke-width="1.5" />
  <rect x="1" y="1" width="1198" height="242" rx="18" fill="url(#tdg)" />
  <rect x="36" y="1" width="290" height="3" rx="1.5" fill="url(#tdl)" />

  <g transform="translate(26, 32)">
    <rect x="0" y="-17" width="242" height="24" rx="12" fill="#17233D" stroke="#37DFFF" stroke-opacity="0.5" stroke-width="1" />
    <circle cx="14" cy="-5" r="3.5" fill="#37DFFF" />
    <text x="26" y="-1" font-family="'Cascadia Code', ui-monospace, monospace" font-size="10" font-weight="700" fill="#37DFFF">FLAGSHIP CASE STUDY • TESTED LOCALLY</text>
    <text x="256" y="0" font-family="'Segoe UI', system-ui, sans-serif" font-size="15.5" font-weight="800" fill="#F4F7FF">TrustDoc — Cryptographic Document Security &amp; Verification Architecture</text>
    <text x="1148" y="0" text-anchor="end" font-family="'Cascadia Code', ui-monospace, monospace" font-size="10.8" font-weight="600" fill="#9A86FF">React • TS • Node • Express • MongoDB</text>
  </g>

  <line x1="150" y1="138" x2="1050" y2="138" stroke="url(#tdl)" stroke-width="2.4" stroke-dasharray="6 6" opacity="0.65" />

  <g transform="translate(26, 68)">
    <rect x="0" y="0" width="266" height="142" rx="13" fill="#0C1324" stroke="#37DFFF" stroke-opacity="0.55" stroke-width="1.3" />
    <rect x="0" y="0" width="266" height="4" rx="2" fill="#37DFFF" />
    <text x="16" y="28" font-family="'Cascadia Code', ui-monospace, monospace" font-size="10.2" font-weight="700" fill="#37DFFF">01 • INGESTION &amp; STORAGE</text>
    <text x="16" y="54" font-family="'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="800" fill="#F4F7FF">TipTap &amp; AES-256-GCM</text>
    <text x="16" y="78" font-family="'Segoe UI', system-ui, sans-serif" font-size="11.8" fill="#9AA9C0">Rich editor &amp; PDF upload with</text>
    <text x="16" y="96" font-family="'Segoe UI', system-ui, sans-serif" font-size="11.8" fill="#9AA9C0">magic-byte checks, 96-bit IV</text>
    <text x="16" y="114" font-family="'Segoe UI', system-ui, sans-serif" font-size="11.8" fill="#9AA9C0">&amp; 128-bit GCM auth-tag storage</text>
  </g>

  <g transform="translate(320, 68)">
    <rect x="0" y="0" width="266" height="142" rx="13" fill="#0C1324" stroke="#9A86FF" stroke-opacity="0.55" stroke-width="1.3" />
    <rect x="0" y="0" width="266" height="4" rx="2" fill="#9A86FF" />
    <text x="16" y="28" font-family="'Cascadia Code', ui-monospace, monospace" font-size="10.2" font-weight="700" fill="#9A86FF">02 • SIGNING &amp; STAMPS</text>
    <text x="16" y="54" font-family="'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="800" fill="#F4F7FF">RSA-PSS &amp; HMAC-SHA256</text>
    <text x="16" y="78" font-family="'Segoe UI', system-ui, sans-serif" font-size="11.8" fill="#9AA9C0">2048-bit RSA-PSS keypairs,</text>
    <text x="16" y="96" font-family="'Segoe UI', system-ui, sans-serif" font-size="11.8" fill="#9AA9C0">timing-safe HMAC stamps &amp;</text>
    <text x="16" y="114" font-family="'Segoe UI', system-ui, sans-serif" font-size="11.8" fill="#9AA9C0">pdf-lib cryptographic watermarks</text>
  </g>

  <g transform="translate(614, 68)">
    <rect x="0" y="0" width="266" height="142" rx="13" fill="#0C1324" stroke="#37DFFF" stroke-opacity="0.55" stroke-width="1.3" />
    <rect x="0" y="0" width="266" height="4" rx="2" fill="#37DFFF" />
    <text x="16" y="28" font-family="'Cascadia Code', ui-monospace, monospace" font-size="10.2" font-weight="700" fill="#37DFFF">03 • VERIFICATION PORTAL</text>
    <text x="16" y="54" font-family="'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="800" fill="#F4F7FF">SHA-256 Integrity Check</text>
    <text x="16" y="78" font-family="'Segoe UI', system-ui, sans-serif" font-size="11.8" fill="#9AA9C0">Content &amp; version hashing,</text>
    <text x="16" y="96" font-family="'Segoe UI', system-ui, sans-serif" font-size="11.8" fill="#9AA9C0">PDF stream diff inspection &amp;</text>
    <text x="16" y="114" font-family="'Segoe UI', system-ui, sans-serif" font-size="11.8" fill="#9AA9C0">instant tamper alert detection</text>
  </g>

  <g transform="translate(908, 68)">
    <rect x="0" y="0" width="266" height="142" rx="13" fill="#0C1324" stroke="#F3C77B" stroke-opacity="0.55" stroke-width="1.3" />
    <rect x="0" y="0" width="266" height="4" rx="2" fill="#F3C77B" />
    <text x="16" y="28" font-family="'Cascadia Code', ui-monospace, monospace" font-size="10.2" font-weight="700" fill="#F3C77B">04 • RBAC &amp; SECURITY OPS</text>
    <text x="16" y="54" font-family="'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="800" fill="#F4F7FF">Sharing, Audit &amp; SOC</text>
    <text x="16" y="78" font-family="'Segoe UI', system-ui, sans-serif" font-size="11.8" fill="#9AA9C0">View/download/edit/verify RBAC,</text>
    <text x="16" y="96" font-family="'Segoe UI', system-ui, sans-serif" font-size="11.8" fill="#9AA9C0">Socket.IO real-time audit logs,</text>
    <text x="16" y="114" font-family="'Segoe UI', system-ui, sans-serif" font-size="11.8" fill="#9AA9C0">rate-limiting &amp; IP threat blocks</text>
  </g>
