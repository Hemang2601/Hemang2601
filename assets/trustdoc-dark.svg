<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="100%" role="img" aria-label="TrustDoc Security Architecture Pipeline">
  <defs>
    <linearGradient id="tdBgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117" />
      <stop offset="100%" stop-color="#161B22" />
    </linearGradient>
    <linearGradient id="tdPipeDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="50%" stop-color="#E5B2A3" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>
    <pattern id="tdDotsDark" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#30363D" opacity="0.75" />
    </pattern>
  </defs>

  <rect x="1" y="1" width="1198" height="218" rx="16" fill="url(#tdBgDark)" stroke="#4D3539" stroke-width="1.5" />
  <rect x="1" y="1" width="1198" height="218" rx="16" fill="url(#tdDotsDark)" />

  <!-- Header Row -->
  <g transform="translate(28, 30)">
    <rect x="0" y="-16" width="236" height="24" rx="12" fill="#251C1F" stroke="#53383E" stroke-width="1" />
    <circle cx="14" cy="-4" r="3.5" fill="#E5B2A3">
      <animate attributeName="opacity" values="1;0.35;1" dur="1.8s" repeatCount="indefinite" />
    </circle>
    <text x="26" y="0" font-family="'Cascadia Code', ui-monospace, monospace" font-size="10.5" font-weight="700" fill="#E5B2A3">FLAGSHIP MCA SEM 4 • PROTOTYPE</text>
    <text x="252" y="1" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="800" fill="#F8FAFC">TrustDoc — Cryptographic Document Transfer &amp; Integrity Pipeline</text>
    <text x="1142" y="1" text-anchor="end" font-family="'Cascadia Code', ui-monospace, monospace" font-size="11" fill="#60A5FA" font-weight="600">React • TS • Node • Express • MongoDB</text>
  </g>

  <!-- Animated Pipeline Track -->
  <line x1="150" y1="124" x2="1050" y2="124" stroke="#30363D" stroke-width="3" />
  <line x1="150" y1="124" x2="1050" y2="124" stroke="url(#tdPipeDark)" stroke-width="3" stroke-dasharray="10 10">
    <animate attributeName="stroke-dashoffset" values="0;-40" dur="1.6s" repeatCount="indefinite" />
  </line>

  <!-- Flowing Data Packets -->
  <circle cy="124" r="5" fill="#60A5FA">
    <animate attributeName="cx" values="150;1050" dur="3.8s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="3.8s" repeatCount="indefinite" />
  </circle>
  <circle cy="124" r="4.5" fill="#E5B2A3">
    <animate attributeName="cx" values="150;1050" dur="3.8s" begin="1.9s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="3.8s" begin="1.9s" repeatCount="indefinite" />
  </circle>

  <!-- Node 1 -->
  <g transform="translate(28, 66)">
    <rect x="0" y="0" width="262" height="122" rx="12" fill="#161B22" stroke="#1E3A8A" stroke-width="1.5" />
    <rect x="0" y="0" width="262" height="4" rx="2" fill="#3B82F6" />
    <text x="18" y="28" font-family="'Cascadia Code', ui-monospace, monospace" font-size="11" font-weight="700" fill="#60A5FA">01 • PAYLOAD ENCRYPTION</text>
    <text x="18" y="54" font-family="'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="800" fill="#F8FAFC">AES-256 Encryption</text>
    <text x="18" y="77" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#94A3B8">Zero-knowledge client encryption</text>
    <text x="18" y="96" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#94A3B8">before payload leaves browser</text>
  </g>

  <!-- Node 2 -->
  <g transform="translate(322, 66)">
    <rect x="0" y="0" width="262" height="122" rx="12" fill="#161B22" stroke="#4D3539" stroke-width="1.5" />
    <rect x="0" y="0" width="262" height="4" rx="2" fill="#E5B2A3" />
    <text x="18" y="28" font-family="'Cascadia Code', ui-monospace, monospace" font-size="11" font-weight="700" fill="#E5B2A3">02 • AUTHENTICITY</text>
    <text x="18" y="54" font-family="'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="800" fill="#F8FAFC">RSA Digital Signatures</text>
    <text x="18" y="77" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#94A3B8">Cryptographic sender verification</text>
    <text x="18" y="96" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#94A3B8">&amp; strict non-repudiation</text>
  </g>

  <!-- Node 3 -->
  <g transform="translate(616, 66)">
    <rect x="0" y="0" width="262" height="122" rx="12" fill="#161B22" stroke="#1E3A8A" stroke-width="1.5" />
    <rect x="0" y="0" width="262" height="4" rx="2" fill="#3B82F6" />
    <text x="18" y="28" font-family="'Cascadia Code', ui-monospace, monospace" font-size="11" font-weight="700" fill="#60A5FA">03 • TAMPER DETECTION</text>
    <text x="18" y="54" font-family="'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="800" fill="#F8FAFC">SHA-256 Integrity Check</text>
    <text x="18" y="77" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#94A3B8">Instant cryptographic digest check</text>
    <text x="18" y="96" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#94A3B8">flagging single-bit alterations</text>
  </g>

  <!-- Node 4 -->
  <g transform="translate(910, 66)">
    <rect x="0" y="0" width="262" height="122" rx="12" fill="#161B22" stroke="#4D3539" stroke-width="1.5" />
    <rect x="0" y="0" width="262" height="4" rx="2" fill="#E5B2A3" />
    <text x="18" y="28" font-family="'Cascadia Code', ui-monospace, monospace" font-size="11" font-weight="700" fill="#E5B2A3">04 • GOVERNANCE</text>
    <text x="18" y="54" font-family="'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="800" fill="#F8FAFC">RBAC &amp; Audit Logging</text>
    <text x="18" y="77" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#94A3B8">Granular view/download rights</text>
    <text x="18" y="96" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#94A3B8">&amp; immutable document trail</text>
  </g>
</svg>
