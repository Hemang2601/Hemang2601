    <text x="18" y="42" font-family="'Segoe UI', system-ui, sans-serif" font-weight="800" font-size="26" fill="#0F172A">9.32</text>
    <text x="18" y="66" font-family="'Segoe UI', system-ui, sans-serif" font-weight="700" font-size="13" fill="#A65D68">BCA Final CGPA</text>
    <text x="18" y="86" font-family="'Cascadia Code', ui-monospace, monospace" font-size="10.5" fill="#64748B">Atmiya • Distinction</text>
  </g>

