<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 116" width="100%" role="img" aria-label="Hemang Lakhadiya Key Milestones">
  <defs>
    <linearGradient id="kpiBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B76E79" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
  </defs>

  <!-- Card 1: Projects -->
  <g transform="translate(4, 6)">
    <rect x="0" y="0" width="224" height="104" rx="14" fill="#FAF8F5" stroke="#E2E8F0" stroke-width="1.3" />
    <rect x="18" y="0" width="60" height="3" rx="1.5" fill="url(#kpiBar)">
      <animate attributeName="width" values="42;92;42" dur="4s" repeatCount="indefinite" />
    </rect>
    <circle cx="198" cy="24" r="4" fill="#2563EB">
      <animate attributeName="opacity" values="1;0.35;1" dur="2.2s" repeatCount="indefinite" />
    </circle>
    <text x="18" y="42" font-family="'Segoe UI', system-ui, sans-serif" font-weight="800" font-size="26" fill="#0F172A">14+</text>
    <text x="18" y="66" font-family="'Segoe UI', system-ui, sans-serif" font-weight="700" font-size="13" fill="#A65D68">Software Projects</text>
    <text x="18" y="86" font-family="'Cascadia Code', ui-monospace, monospace" font-size="10.5" fill="#64748B">Web • Mobile • APIs</text>
  </g>

  <!-- Card 2: BCA CGPA -->
  <g transform="translate(246, 6)">
