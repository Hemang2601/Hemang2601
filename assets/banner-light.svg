<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" role="img" aria-label="Hemang Lakhadiya - Full Stack Developer and Mobile Architect">
  <defs>
    <linearGradient id="bgLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="55%" stop-color="#FAF8F5" />
      <stop offset="100%" stop-color="#F3F6FA" />
    </linearGradient>
    <linearGradient id="roseGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C88A78" />
      <stop offset="50%" stop-color="#B76E79" />
      <stop offset="100%" stop-color="#D9A79C" />
    </linearGradient>
    <linearGradient id="brandBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <pattern id="dotGridLight" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.15" fill="#CBD5E1" opacity="0.65" />
    </pattern>
    <radialGradient id="warmGlow" cx="80%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#E8C5BA" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="coolGlow" cx="15%" cy="85%" r="50%">
      <stop offset="0%" stop-color="#DBEAFE" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Base Card -->
  <rect x="1" y="1" width="1198" height="318" rx="18" fill="url(#bgLight)" stroke="#E2E8F0" stroke-width="1.5" />
  <rect x="1" y="1" width="1198" height="318" rx="18" fill="url(#dotGridLight)" />
  <rect x="1" y="1" width="1198" height="318" rx="18" fill="url(#warmGlow)" />
  <rect x="1" y="1" width="1198" height="318" rx="18" fill="url(#coolGlow)" />

  <!-- Top Accent Hairline -->
  <rect x="44" y="1" width="220" height="3" rx="1.5" fill="url(#roseGold)" />

  <!-- HL Monogram + Status Eyebrow -->
  <g transform="translate(52, 42)">
    <rect x="0" y="0" width="42" height="42" rx="11" fill="url(#brandBlue)" />
    <text x="21" y="27" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-weight="800" font-size="18" fill="#FFFFFF" letter-spacing="0.5">HL</text>

    <rect x="56" y="7" width="268" height="28" rx="14" fill="#FFFFFF" stroke="#E5D3CE" stroke-width="1.2" />
    <circle cx="73" cy="21" r="4" fill="#B76E79" />
    <text x="86" y="25.5" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-weight="600" font-size="12" fill="#64748B">App Full Stack Intern @ Zennaxx Technology</text>
  </g>

  <!-- Main Identity -->
  <g transform="translate(52, 134)">
    <text x="0" y="0" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-weight="800" font-size="40" fill="#0F172A" letter-spacing="1.2">HEMANG LAKHADIYA</text>
    <text x="0" y="34" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-weight="700" font-size="19" fill="#A65D68" letter-spacing="0.3">Full Stack Developer  |  Mobile Architect</text>
    <rect x="0" y="50" width="76" height="2.5" rx="1.25" fill="url(#roseGold)" />
    <text x="0" y="76" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-weight="500" font-size="15.5" fill="#475569">Building Scalable Applications &amp; Digital Experiences</text>
  </g>

  <!-- Bottom Verified Metadata Pills -->
  <g transform="translate(52, 248)" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600">
    <rect x="0" y="0" width="166" height="32" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
    <text x="16" y="20.5" fill="#334155">Rajkot, Gujarat, India</text>

    <rect x="178" y="0" width="198" height="32" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
    <text x="194" y="20.5" fill="#334155">MCA @ Marwadi University</text>

    <rect x="388" y="0" width="212" height="32" rx="8" fill="#FDF8F6" stroke="#E5CFC9" stroke-width="1" />
    <text x="404" y="20.5" fill="#9A5560">1st Place • Code Carnival 3.0</text>
  </g>

  <!-- Right Side: Portfolio-Inspired Code Identity Card -->
  <g transform="translate(736, 42)">
    <rect x="0" y="0" width="412" height="236" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.3" />
    <!-- Window Header -->
    <rect x="0" y="0" width="412" height="36" rx="14" fill="#F8FAFC" />
    <rect x="0" y="22" width="412" height="14" fill="#F8FAFC" />
    <line x1="0" y1="36" x2="412" y2="36" stroke="#E2E8F0" stroke-width="1" />
    <circle cx="20" cy="18" r="5" fill="#FDA4AF" />
    <circle cx="36" cy="18" r="5" fill="#FCD34D" />
    <circle cx="52" cy="18" r="5" fill="#86EFAC" />
    <text x="72" y="22" font-family="'Cascadia Code', 'JetBrains Mono', ui-monospace, monospace" font-size="11.5" font-weight="600" fill="#64748B">hemang-profile.ts</text>
    <rect x="342" y="9" width="54" height="18" rx="9" fill="#FDF2F0" stroke="#E8C9C1" stroke-width="1" />
    <text x="369" y="21.5" text-anchor="middle" font-family="'Cascadia Code', ui-monospace, monospace" font-size="10" font-weight="700" fill="#A65D68">v3.0</text>

    <!-- Code Lines -->
    <g transform="translate(20, 62)" font-family="'Cascadia Code', 'JetBrains Mono', ui-monospace, monospace" font-size="12">
      <text x="0" y="0" fill="#2563EB" font-weight="600">const <tspan fill="#0F172A">developer</tspan> <tspan fill="#64748B">=</tspan> <tspan fill="#64748B">{</tspan></text>
      <text x="16" y="25" fill="#64748B">focus: <tspan fill="#A65D68">"Backend, APIs &amp; Security"</tspan>,</text>
      <text x="16" y="50" fill="#64748B">web: <tspan fill="#0F172A">["Node.js", "Express", "Laravel"]</tspan>,</text>
      <text x="16" y="75" fill="#64748B">mobile: <tspan fill="#0F172A">["Flutter", "Dart", "Android"]</tspan>,</text>
      <text x="16" y="100" fill="#64748B">data: <tspan fill="#0F172A">["MongoDB", "MySQL", "SQL"]</tspan>,</text>
      <text x="16" y="125" fill="#64748B">flagship: <tspan fill="#2563EB">"TrustDoc (MCA Sem 4)"</tspan>,</text>
      <text x="16" y="150" fill="#64748B">academic: <tspan fill="#0F172A">"MCA 8.83 | BCA 9.32"</tspan></text>
      <text x="0" y="172" fill="#64748B">};</text>
    </g>
